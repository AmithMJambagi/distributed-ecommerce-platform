# ====================================================================
# APACHE KAFKA (KRaft Mode - Zero ZooKeeper Overhead)
# ====================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
spec:
  ports:
    - port: 9092
      name: internal
  clusterIP: None
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ecommerce
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.2
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
---
# ====================================================================
# KAFKA TOPIC PROVISIONER JOB (Guarantees 4 Topics with 3 Partitions)
# ====================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-provisioner
  namespace: ecommerce
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-creator
          image: apache/kafka:4.1.2
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka broker to accept connections..."
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                echo "Kafka not ready yet, sleeping 3 seconds..."
                sleep 3
              done

              echo "Kafka is ready! Creating required topics with 3 partitions..."
              topics=("order-events" "payment-events" "inventory-events" "payment-requests")
              for topic in "${topics[@]}"; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                  --create --if-not-exists \
                  --topic "$topic" \
                  --partitions 3 \
                  --replication-factor 1
                echo "Provisioned topic: $topic (3 partitions)"
              done
              echo "All 4 Kafka topics provisioned successfully!"
