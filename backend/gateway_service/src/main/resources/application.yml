server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: gateway_service

  #  PostgreSQL Database Configuration (JPA / Hibernate)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:gateway_service}
    username: ${DB_USERNAME:your_db_username}
    password: ${DB_PASSWORD:your_db_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  #  Redis Configuration (For 5-Minute Ephemeral OTPs)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  #  SMTP Mail Configuration (For OTP dispatch)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-mail-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:gateway_service}

  #  Declarative Gateway MVC Routing Map
  cloud:
    gateway:
      mvc:
        routes:
          # Product Service Route
          - id: product-service-route
            uri: ${SERVICES_PRODUCT_URL:http://localhost:8080}
            predicates:
              - Path=/api/v1/products/**

          # Inventory Service Route
          - id: inventory-service-route
            uri: ${SERVICES_INVENTORY_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/inventory/**

          # Order & Cart Service Route
          - id: order-service-route
            uri: ${SERVICES_ORDER_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/orders/**, /api/v1/cart/**

          # Payment Service Route
          - id: payment-service-route
            uri: ${SERVICES_PAYMENT_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/payments/**

#  Security, JWT & Access Control Configuration
security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-bytes}
    expiration-seconds: 86400 # 24 hours

  # Whitelist of public paths that bypass JWT authentication
  whitelist:
    - "/api/v1/auth/**"
    - "/api/v1/payments/callback"
    - "/api/v1/inventory/batch"

  # Public read-only endpoints (GET only)
  public-read-paths:
    - "/api/v1/products/**"
    - "/api/v1/inventory/**"

  # Protected routes requiring ROLE_ADMIN
  admin-paths:
    - path: "/api/v1/products/**"
      methods: ["POST", "PUT", "DELETE"]
    - path: "/api/v1/inventory/init"
      methods: ["POST"]

#  Central CORS Configuration
cors:
  allowed-origins:
    - "http://localhost:5173" # Local Vite development
    - "http://localhost:3000"
    - "${CORS_ALLOWED_ORIGIN:http://localhost:5173}" # Dynamic cluster/domain origin
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed-headers:
    - "*"
  allow-credentials: true

#  Logging with Thread ID, Method, and Timestamp
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M - %msg%n"
  level:
    root: INFO
    com.ecommerce.gateway_service: DEBUG
    org.springframework.cloud.gateway: INFO