server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-service

  # Database Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:payment_service}
    username: ${DB_USERNAME:your_db_username}
    password: ${DB_PASSWORD:your_db_password}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

# Razorpay Sandbox / Test Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:your_razorpay_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
  # Where Razorpay redirects the browser after payment
  callback-url: ${RAZORPAY_CALLBACK_URL:http://localhost:8084/api/v1/payments/callback}
  frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:5173/order-success}

#  Logging with Thread ID, Class, Method, and Timestamp
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M - %msg%n"
  level:
    root: INFO
    com.ecommerce.payment_service: INFO
    org.springframework.kafka: INFO